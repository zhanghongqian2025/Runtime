name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:deps
      - run: pnpm check:secrets
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The transport check runs the built runtime against a local
      # OpenAI-compatible server over a real socket and a real SSE stream. It
      # needs no network and no key, so it belongs here: without it the
      # provider adapters are only exercised by the fake provider.
      - run: pnpm check:transport
