<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Agent Runtime</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1117;
        --panel: #131a23;
        --line: #243040;
        --text: #d6deeb;
        --muted: #7d8da3;
        --accent: #4cc2ff;
        --ok: #56d364;
        --warn: #e3b341;
        --err: #f85149;
        --user: #1f6feb33;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--bg); color: var(--text);
        font: 14px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      }
      header {
        display: flex; align-items: center; gap: 16px; padding: 10px 16px;
        border-bottom: 1px solid var(--line); background: var(--panel); flex: none;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
      header .meta { color: var(--muted); font-size: 12px; }
      header .spacer { flex: 1; }
      button {
        font: inherit; color: var(--text); background: #1b2431; border: 1px solid var(--line);
        border-radius: 6px; padding: 5px 11px; cursor: pointer;
      }
      button:hover { border-color: var(--accent); color: var(--accent); }
      button.primary { background: #14406b; border-color: #1f6feb; color: #cfe8ff; }
      button:disabled { opacity: .45; cursor: not-allowed; }
      main { flex: 1; display: grid; grid-template-columns: 260px minmax(0, 1fr) 320px; min-height: 0; }
      /* A split screen is narrow. The side columns give way before the chat
         does: `minmax(0, 1fr)` keeps the chat from forcing the grid wider
         than the window. */
      @media (max-width: 1100px) {
        main { grid-template-columns: 200px minmax(0, 1fr) 230px; }
        #chat { padding: 14px 16px; }
      }
      @media (max-width: 800px) {
        main { grid-template-columns: 168px minmax(0, 1fr) 186px; }
        #chat { padding: 12px; }
        header { gap: 10px; padding: 8px 10px; }
        .session .id { font-size: 10px; }
      }
      /* Every pane scrolls on its own. Without `min-height: 0` the grid row
         would grow to the tallest pane and push the composer off screen. */
      aside, section, #events { overflow: auto; min-height: 0; }
      aside { border-right: 1px solid var(--line); background: var(--panel); padding: 10px; }
      #events { border-left: 1px solid var(--line); background: var(--panel); padding: 10px; }
      .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; margin: 4px 2px 8px; }
      .session {
        padding: 8px 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px;
        border: 1px solid transparent; font-size: 13px;
      }
      .session:hover { background: #182130; }
      .session.active { background: #14263a; border-color: #1f6feb; }
      .session .id { color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; }
      #chat { padding: 18px 22px; }
      .msg { margin-bottom: 16px; }
      .msg .who { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
      .bubble { padding: 10px 13px; border-radius: 9px; white-space: pre-wrap; word-break: break-word; }
      .msg.user .bubble { background: var(--user); border: 1px solid #1f6feb55; }
      .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--line); }
      .msg.tool .bubble { background: #0f1a14; border: 1px solid #2ea04355; font-family: ui-monospace, monospace; font-size: 12px; }
      .msg.thinking .bubble { color: #b6c2d1; font-style: italic; border-left: 2px solid var(--warn); }
      /* Pending approvals and questions live outside the chat. Re-rendering the
         chat must never be able to destroy a card the user still has to act on. */
      #cards { flex: none; max-height: 40vh; overflow: auto; padding: 0 16px; }
      #cards:empty { padding: 0; }
      .card { margin: 10px 0; padding: 12px 14px; border-radius: 9px; border: 1px solid var(--warn); background: #1d1a0d; }
      .card h4 { margin: 0 0 6px; font-size: 13px; color: var(--warn); }
      .card pre { margin: 6px 0 10px; font-size: 12px; color: #cfd8e3; white-space: pre-wrap; }
      .card .actions { display: flex; gap: 8px; }
      #banner { flex: none; margin: 0 16px 8px; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--err); background: #2a1414; color: #ffb4ae; font-size: 13px; }
      #banner[hidden] { display: none; }
      #composer { flex: none; border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px; display: flex; gap: 10px; }
      #input {
        flex: 1; resize: none; height: 52px; padding: 10px 12px; border-radius: 8px;
        border: 1px solid var(--line); background: #0b1017; color: var(--text); font: inherit;
      }
      #input:focus { outline: none; border-color: var(--accent); }
      .ev { font-family: ui-monospace, monospace; font-size: 11.5px; padding: 3px 6px; border-left: 2px solid var(--line); margin-bottom: 3px; color: #9fb0c5; word-break: break-all; }
      .ev b { color: var(--text); font-weight: 500; }
      .ev.ok { border-left-color: var(--ok); }
      .ev.warn { border-left-color: var(--warn); }
      .ev.err { border-left-color: var(--err); color: #ffb4ae; }
      .ev.accent { border-left-color: var(--accent); }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .row input { flex: 1; background: #0b1017; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 6px 8px; font: inherit; }
      .hint { color: var(--muted); font-size: 12px; padding: 8px 2px; }
      .pill { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
      .pill.live { color: var(--ok); border-color: #2ea04366; }
      .pill.off { color: var(--err); border-color: #f8514966; }
      .pill.plan { color: var(--warn); border-color: #e3b34166; }
      /* The goal and plan panel is an overlay: it needs room for text, and it
         must never push the chat out of view. */
      #modal[hidden] { display: none; }
      #modal {
        position: fixed; inset: 0; z-index: 20; background: #000a;
        display: flex; align-items: center; justify-content: center; padding: 24px;
      }
      #modal .dialog {
        width: min(760px, 100%); max-height: 84vh; overflow: auto;
        background: var(--panel); border: 1px solid var(--line);
        border-radius: 12px; padding: 18px 20px;
      }
      #modal .dialog > header { all: unset; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
      #modal h3 { margin: 0; font-size: 15px; font-weight: 600; }
      #modal .section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
      #modal .section h4 { margin: 0 0 8px; font-size: 13px; color: var(--accent); }
      #modal .field { margin: 8px 0; }
      #modal label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
      #modal textarea, #modal input {
        width: 100%; background: #0b1017; border: 1px solid var(--line);
        color: var(--text); border-radius: 8px; padding: 8px 10px; font: inherit;
      }
      #modal textarea { min-height: 150px; resize: vertical; }
      #modal .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
      #modal .kv { font-size: 13px; line-height: 1.7; }
      #modal .kv b { color: var(--text); font-weight: 600; }
      #modal .muted { color: var(--muted); font-size: 12px; }
      #modal ul { margin: 6px 0 0; padding-left: 18px; color: #cfd8e3; }
      #modal .row-inline { display: flex; gap: 8px; align-items: center; }
      #modal .row-inline input { width: 140px; }
      .plan-markdown { max-height: 320px; overflow: auto; background: #0b1017; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; margin: 8px 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>Local Agent Runtime</h1>
      <span class="meta" id="version">…</span>
      <span class="spacer"></span>
      <span class="pill" id="conn">连接中</span>
      <span class="pill" id="state">idle</span>
      <span class="pill plan" id="plan-state" hidden>计划模式</span>
      <button id="open-panel">目标 / 计划</button>
      <button id="new-session">新建会话</button>
    </header>

    <main>
      <aside>
        <div class="label">会话</div>
        <div id="sessions"></div>
      </aside>

      <section id="chat">
        <div class="hint">左侧选一个会话，或新建一个。消息会走真实模型与真实工具。</div>
      </section>

      <div id="events">
        <div class="label">实时事件流</div>
        <div id="eventlog"></div>
      </div>
    </main>

    <div id="cards"></div>
    <div id="banner" hidden></div>

    <div id="composer">
      <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="primary" id="send">发送</button>
    </div>

    <div id="modal" hidden>
      <div class="dialog">
        <header>
          <h3>目标与计划</h3>
          <span class="spacer"></span>
          <button id="close-panel">关闭</button>
        </header>

        <div class="section">
          <h4>目标</h4>
          <div id="goal-view" class="kv"><span class="muted">读取中…</span></div>
          <div class="field">
            <label for="goal-text">设定目标（识别「目标 / 验收 / 约束 / 边界 / 停止条件」这些标签；缺验收标准时模型会反问你）</label>
            <textarea id="goal-text" placeholder="目标: …"></textarea>
          </div>
          <div class="actions">
            <button class="primary" id="goal-set">设定目标</button>
            <div class="row-inline">
              <label for="goal-budget" style="margin:0">token 预算</label>
              <input id="goal-budget" type="number" min="1" placeholder="例如 200000" />
            </div>
          </div>
          <div class="actions" id="goal-actions"></div>
        </div>

        <div class="section">
          <h4>计划</h4>
          <div id="plan-view" class="kv"><span class="muted">读取中…</span></div>
          <div class="actions">
            <button id="plan-enter">进入计划模式</button>
            <button id="plan-freeze">冻结草稿并审阅</button>
          </div>
          <div id="plan-review"></div>
        </div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let currentSession = null;
      let offset = 0;
      let streaming = null;
      let thinking = null;
      let streamAbort = null;
      let streamToken = 0;
      let renderToken = 0;
      // User messages the server has not stored yet. A history re-sync must not
      // drop them, otherwise the sent message silently disappears from the chat.
      const unsent = [];

      const el = (tag, cls, text) => {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      function showBanner(text) {
        const banner = $('banner');
        banner.textContent = text;
        banner.hidden = false;
      }

      function hideBanner() {
        $('banner').hidden = true;
      }

      function logEvent(event) {
        const line = el('div', 'ev');
        const name = el('b', null, event.type);
        line.appendChild(name);
        let detail = '';
        if (event.type === 'tool.call.started' || event.type === 'tool.call.completed') detail = ' ' + (event.name || '');
        if (event.type === 'permission.requested') detail = ' ' + (event.approval?.toolName || '') + ' — ' + (event.approval?.reason || '');
        if (event.type === 'session.status') detail = ' ' + (event.status || '') + (event.reason ? ' — ' + event.reason : '');
        if (event.type === 'message.delta') detail = ' ' + (event.text || '').slice(0, 60);
        if (detail) line.appendChild(el('span', null, detail));
        if (event.type === 'session.status' && event.status === 'completed') line.classList.add('ok');
        if (event.type === 'session.status' && event.status === 'failed') line.classList.add('err');
        if (event.type === 'permission.requested') line.classList.add('warn');
        if (event.type === 'tool.call.started') line.classList.add('accent');
        $('eventlog').prepend(line);
        while ($('eventlog').childElementCount > 200) $('eventlog').lastChild.remove();
      }

      function setState(text, live) {
        $('state').textContent = text;
        $('state').className = live ? 'pill live' : 'pill';
      }

      function setConnection(text, ok) {
        $('conn').textContent = text;
        $('conn').className = ok ? 'pill live' : 'pill off';
      }

      function bubble(kind, who) {
        const wrap = el('div', 'msg ' + kind);
        wrap.appendChild(el('div', 'who', who));
        const body = el('div', 'bubble');
        wrap.appendChild(body);
        $('chat').appendChild(wrap);
        $('chat').scrollTop = $('chat').scrollHeight;
        return body;
      }

      function messageText(message) {
        let text = '';
        for (const block of message.content || []) {
          if (block.type === 'text') text += block.text;
          if (block.type === 'tool_result') {
            text += (text ? '\n' : '') + (block.content || []).map((c) => c.text || '').join('\n');
          }
          if (block.type === 'tool_use') text += (text ? '\n' : '') + '→ ' + block.name + ' ' + JSON.stringify(block.input);
        }
        return text;
      }

      function renderHistory(messages) {
        $('chat').innerHTML = '';
        for (const message of messages) {
          const kind = message.role === 'user' ? 'user' : message.role === 'tool' ? 'tool' : 'assistant';
          const body = bubble(kind, message.role);
          body.textContent = messageText(message);
        }
        $('chat').scrollTop = $('chat').scrollHeight;
      }

      async function apiOnce(path, options) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), options?.timeoutMs ?? 15000);
        try {
          const response = await fetch(path, {
            ...options,
            signal: controller.signal,
            cache: 'no-store',
            headers: { 'content-type': 'application/json', ...(options?.headers || {}) },
          });
          const text = await response.text();
          let body;
          if (text) {
            try {
              body = JSON.parse(text);
            } catch {
              body = undefined;
            }
          }
          if (!response.ok) {
            const detail = body?.error?.message || body?.message || 'HTTP ' + response.status;
            const error = new Error(detail);
            error.status = response.status;
            throw error;
          }
          return { status: response.status, body };
        } finally {
          clearTimeout(timer);
        }
      }

      /**
       * One request, with a deadline and one retry.
       *
       * A request that never answers must not leave the interface waiting for
       * ever. Only a transport failure is retried: an HTTP answer is an
       * answer, even when it says "no".
       */
      async function api(path, options) {
        const attempts = options?.attempts ?? 2;
        let lastError;
        for (let attempt = 1; attempt <= attempts; attempt += 1) {
          try {
            return await apiOnce(path, options);
          } catch (error) {
            lastError = error;
            if (error.status !== undefined) throw error;
            if (attempt < attempts) await new Promise((resolve) => setTimeout(resolve, 300));
          }
        }
        throw lastError;
      }

      async function loadSessions() {
        const result = await api('/v1/sessions');
        const list = result.body?.sessions || [];
        const box = $('sessions');
        box.innerHTML = '';
        for (const session of list) {
          const item = el('div', 'session' + (session.id === currentSession ? ' active' : ''));
          item.appendChild(el('div', null, session.title || '未命名会话'));
          item.appendChild(el('div', 'id', session.id.slice(0, 12) + ' · ' + session.messageCount + ' 条'));
          item.onclick = () => selectSession(session.id);
          box.appendChild(item);
        }
        if (list.length === 0) box.appendChild(el('div', 'hint', '还没有会话'));
        return list;
      }

      async function selectSession(id) {
        const token = ++renderToken;
        currentSession = id;
        offset = 0;
        streaming = null;
        thinking = null;
        unsent.length = 0;
        $('cards').innerHTML = '';
        const detail = await api('/v1/sessions/' + id);
        if (token !== renderToken) return;
        const history = await api('/v1/sessions/' + id + '/history');
        if (token !== renderToken) return;
        renderHistory(history.body?.messages || []);
        await loadSessions();
        // Resume from the current end of the log: replaying from zero would
        // duplicate every past message into the chat.
        connect(id, detail.body?.logOffset || 0);
        await refreshGoal();
        await refreshPlan();
      }

      /* ── 目标与计划面板 ──────────────────────────────── */

      function escapeHtml(text) {
        return String(text).replace(/[&<>"']/g, (character) => {
          if (character === '&') return '&amp;';
          if (character === '<') return '&lt;';
          if (character === '>') return '&gt;';
          if (character === '"') return '&quot;';
          return '&#39;';
        });
      }

      function listHtml(items) {
        if (!Array.isArray(items) || items.length === 0) return '';
        return '<ul>' + items.map((item) => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul>';
      }

      async function refreshGoal() {
        const view = $('goal-view');
        const actions = $('goal-actions');
        if (!currentSession) {
          view.innerHTML = '<span class="muted">先选一个会话。</span>';
          actions.innerHTML = '';
          return;
        }
        try {
          const result = await api('/v1/sessions/' + currentSession + '/goal');
          const goal = result.body?.goal;
          if (goal === undefined) {
            view.innerHTML = '<span class="muted">这个会话还没有目标。</span>';
            actions.innerHTML = '';
            return;
          }
          const budget = goal.budget || {};
          const limit = budget.tokenLimit === undefined ? '不限' : String(budget.tokenLimit);
          view.innerHTML =
            '<div>状态 <b>' + escapeHtml(goal.status) + '</b> · 轮次 <b>' + escapeHtml(goal.rounds) +
            '</b>（已验证 ' + escapeHtml(goal.verifiedRounds ?? 0) + '）· token <b>' +
            escapeHtml(budget.tokensUsed ?? 0) + '</b> / ' + escapeHtml(limit) + '</div>' +
            '<div>目标：<b>' + escapeHtml(goal.objective || '') + '</b></div>' +
            '<div class="muted">验收标准</div>' + listHtml(goal.acceptanceCriteria) +
            (goal.constraints?.length ? '<div class="muted">约束</div>' + listHtml(goal.constraints) : '') +
            (goal.workBoundary?.length ? '<div class="muted">边界</div>' + listHtml(goal.workBoundary) : '') +
            (goal.stopConditions?.length ? '<div class="muted">停止条件</div>' + listHtml(goal.stopConditions) : '') +
            (goal.blockedReport === undefined
              ? ''
              : '<div class="muted">阻塞报告</div><div>' + escapeHtml(goal.blockedReport.reason || '') + '</div>') +
            (goal.pauseReason === undefined
              ? ''
              : '<div class="muted">暂停原因</div><div>' + escapeHtml(goal.pauseReason) + '</div>');
          actions.innerHTML = '';
          for (const [label, status] of [
            ['标记完成', 'completed'],
            ['标记阻塞', 'blocked'],
            ['暂停', 'paused'],
            ['恢复', 'active'],
            ['清除', 'cleared'],
          ]) {
            const button = el('button', '', label);
            button.onclick = () => setGoalStatus(status);
            actions.appendChild(button);
          }
          if (goal.status === 'paused') {
            actions.appendChild(el('span', 'muted', '恢复后会自己接着跑这一轮'));
          }
        } catch (error) {
          if (error.status === 404) {
            view.innerHTML = '<span class="muted">这个会话还没有目标。</span>';
            actions.innerHTML = '';
            return;
          }
          view.innerHTML = '<span class="muted">读取目标失败：' + escapeHtml(error.message) + '</span>';
        }
      }

      async function setGoal() {
        const text = $('goal-text').value.trim();
        if (text.length === 0) {
          showBanner('目标文本是空的。');
          return;
        }
        const raw = $('goal-budget').value.trim();
        const tokenBudget = raw.length > 0 ? Number(raw) : undefined;
        try {
          await api('/v1/sessions/' + currentSession + '/goal', {
            method: 'POST',
            body: JSON.stringify({
              text,
              ...(tokenBudget === undefined ? {} : { tokenBudget }),
            }),
          });
          hideBanner();
          await refreshGoal();
        } catch (error) {
          showBanner('设定目标失败：' + error.message);
        }
      }

      async function setGoalStatus(status) {
        try {
          await api('/v1/sessions/' + currentSession + '/goal', {
            method: 'POST',
            body: JSON.stringify({ status }),
          });
          hideBanner();
          await refreshGoal();
        } catch (error) {
          showBanner('修改目标状态失败：' + error.message);
        }
      }

      async function refreshPlan() {
        const view = $('plan-view');
        const reviewBox = $('plan-review');
        const pill = $('plan-state');
        if (!currentSession) {
          view.innerHTML = '<span class="muted">先选一个会话。</span>';
          return;
        }
        let state;
        try {
          const result = await api('/v1/sessions/' + currentSession + '/plan');
          state = result.body;
        } catch (error) {
          view.innerHTML = '<span class="muted">读取计划状态失败：' + escapeHtml(error.message) + '</span>';
          return;
        }
        const review = state?.review;
        if (state?.mode === 'plan') {
          pill.hidden = false;
          pill.textContent = '计划模式';
          pill.className = 'pill plan';
        } else {
          pill.hidden = true;
        }
        view.innerHTML =
          '<div>模式 <b>' + escapeHtml(state?.mode ?? 'default') + '</b>' +
          (state?.blocked ? ' · <b>有待审阅的计划</b>' : '') + '</div>' +
          (review === undefined ? '' : '<div>审阅状态 <b>' + escapeHtml(review.state) + '</b></div>');
        reviewBox.innerHTML = '';
        if (review !== undefined && review.state === 'pending') {
          const pre = el('div', 'plan-markdown');
          pre.textContent = review.markdown ?? '';
          const feedback = el('input');
          feedback.placeholder = '驳回时写明原因（可选）';
          const actions = el('div', 'actions');
          const approve = el('button', 'primary', '通过');
          approve.onclick = () => answerPlanReview(review.requestId, 'approve', '');
          const reject = el('button', '', '驳回');
          reject.onclick = () => answerPlanReview(review.requestId, 'reject', feedback.value.trim());
          actions.appendChild(approve);
          actions.appendChild(reject);
          reviewBox.appendChild(pre);
          reviewBox.appendChild(feedback);
          reviewBox.appendChild(actions);
        }
        showPlanCard(state);
      }

      /**
       * A pending plan review also shows up in the chat area: the session is
       * fenced until it is answered, so it must not be possible to miss it.
       */
      function showPlanCard(state) {
        const existing = $('plan-card');
        if (existing !== null) existing.remove();
        const review = state?.review;
        if (review === undefined || review.state !== 'pending') return;

        const card = el('div', 'card');
        card.id = 'plan-card';
        card.appendChild(el('h4', null, '计划待审阅：审阅之前不会执行任何操作'));
        const pre = el('div', 'plan-markdown');
        pre.textContent = review.markdown ?? '';
        card.appendChild(pre);
        const feedback = el('input');
        feedback.placeholder = '驳回时写明原因（可选）';
        const actions = el('div', 'actions');
        const approve = el('button', 'primary', '通过');
        approve.onclick = () => answerPlanReview(review.requestId, 'approve', '');
        const reject = el('button', '', '驳回');
        reject.onclick = () => answerPlanReview(review.requestId, 'reject', feedback.value.trim());
        actions.appendChild(approve);
        actions.appendChild(reject);
        card.appendChild(feedback);
        card.appendChild(actions);
        $('cards').appendChild(card);
      }

      async function answerPlanReview(requestId, decision, feedback) {
        try {
          await api('/v1/sessions/' + currentSession + '/plan/review', {
            method: 'POST',
            body: JSON.stringify({
              requestId,
              decision,
              ...(feedback.length > 0 ? { feedback } : {}),
            }),
          });
          hideBanner();
          await refreshPlan();
        } catch (error) {
          showBanner('审阅提交失败：' + error.message);
        }
      }

      async function enterPlanMode() {
        try {
          await api('/v1/sessions/' + currentSession + '/mode', {
            method: 'POST',
            body: JSON.stringify({ interactionMode: 'plan' }),
          });
          hideBanner();
          await refreshPlan();
        } catch (error) {
          showBanner('进入计划模式失败：' + error.message);
        }
      }

      async function freezePlan() {
        try {
          await api('/v1/sessions/' + currentSession + '/mode', {
            method: 'POST',
            body: JSON.stringify({ interactionMode: 'default' }),
          });
          hideBanner();
          await refreshPlan();
        } catch (error) {
          showBanner('冻结计划失败：' + error.message);
        }
      }

      /**
       * Keep the event stream open. A dropped stream reconnects with a
       * backoff instead of silently stopping every live update.
       */
      async function connect(sessionId, from) {
        if (streamAbort) streamAbort.abort();
        const token = ++streamToken;
        offset = from;
        let delay = 500;
        for (;;) {
          if (token !== streamToken) return;
          const controller = new AbortController();
          streamAbort = controller;
          setConnection('连接中', false);
          try {
            const response = await fetch('/v1/sessions/' + sessionId + '/events?after=' + offset, {
              signal: controller.signal,
            });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            setConnection('已连接', true);
            delay = 500;
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            for (;;) {
              const { done, value } = await reader.read();
              if (done) break;
              buffer += decoder.decode(value, { stream: true });
              for (;;) {
                const cut = buffer.indexOf('\n\n');
                if (cut < 0) break;
                const block = buffer.slice(0, cut);
                buffer = buffer.slice(cut + 2);
                const line = block.split('\n').find((l) => l.startsWith('data: '));
                if (!line) continue;
                let event;
                try { event = JSON.parse(line.slice(6)); } catch { continue; }
                handleEvent(event);
              }
            }
          } catch {
            if (token !== streamToken) return;
          }
          if (token !== streamToken) return;
          setConnection('已断开', false);
          showBanner('事件流断开，正在重连…');
          await new Promise((resolve) => setTimeout(resolve, delay));
          delay = Math.min(delay * 2, 5000);
        }
      }

      async function syncHistory() {
        const token = renderToken;
        if (!currentSession) return;
        try {
          const history = await api('/v1/sessions/' + currentSession + '/history');
          if (token !== renderToken) return;
          const messages = history.body?.messages || [];
          renderHistory(messages);
          // Put back the messages the server has not stored yet.
          for (let i = unsent.length - 1; i >= 0; i -= 1) {
            const text = unsent[i];
            const stored = messages.some(
              (message) => message.role === 'user' && messageText(message).includes(text),
            );
            if (stored) {
              unsent.splice(i, 1);
              continue;
            }
            const body = bubble('user', 'user');
            body.textContent = text;
          }
          // The message count in the sidebar is part of the session list.
          await loadSessions();
        } catch {
          // A failed re-sync is not worth interrupting the user for.
        }
      }

      function handleEvent(event) {
        if (event.logOffset) offset = event.logOffset;
        logEvent(event);

        if (event.type === 'message.delta') {
          if (!streaming) streaming = bubble('assistant', 'assistant');
          streaming.textContent += event.text || '';
          $('chat').scrollTop = $('chat').scrollHeight;
        }
        if (event.type === 'message.completed') {
          streaming = null;
          thinking = null;
        }
        if (event.type === 'thinking.delta') {
          if (!thinking) thinking = bubble('thinking', 'thinking');
          thinking.textContent += event.text || '';
        }
        if (event.type === 'tool.call.started') {
          const body = bubble('tool', 'tool · ' + event.name);
          body.textContent += JSON.stringify(event.input);
        }
        if (event.type === 'tool.call.completed') {
          const body = bubble('tool', 'tool · ' + event.name + ' · 完成');
          const result = event.result?.content || [];
          body.textContent += result.map((c) => c.text || '').join('\n').slice(0, 4000);
        }
        if (event.type === 'tool.call.blocked') {
          const body = bubble('tool', 'tool · ' + event.name + ' · 被拦截');
          body.textContent += event.reason || '';
        }
        if (event.type === 'permission.requested') showApproval(event.approval);
        if (event.type === 'question.requested') showQuestion(event.question);
        if (event.type === 'goal.updated') {
          void refreshGoal();
        }
        if (event.type === 'plan.mode.changed' || event.type === 'plan.review.requested' || event.type === 'plan.review.resolved') {
          void refreshPlan();
        }
        if (event.type === 'session.status') {
          setState(event.status, event.status === 'running');
          if (event.status === 'completed') {
            syncHistory();
            // The goal state and the plan review change with the turn.
            void refreshGoal();
            void refreshPlan();
          }
          if (event.status === 'failed') {
            const reason = event.reason || event.error?.message || '未知错误';
            showBanner('本轮失败：' + reason);
          }
        }
      }

      function showApproval(approval) {
        if (!approval) return;
        const card = el('div', 'card');
        card.appendChild(el('h4', null, '需要批准：' + approval.toolName + '（风险 ' + approval.risk + '）'));
        card.appendChild(el('div', null, approval.reason || ''));
        card.appendChild(el('pre', null, JSON.stringify(approval.input)));
        const actions = el('div', 'actions');
        const choose = async (choice) => {
          card.remove();
          try {
            await api('/v1/sessions/' + currentSession + '/permissions/' + approval.requestId, {
              method: 'POST',
              body: JSON.stringify({ choice }),
            });
            hideBanner();
          } catch (error) {
            showBanner('审批提交失败：' + error.message);
          }
        };
        for (const [label, choice] of [['单次允许', 'allow-once'], ['本会话允许', 'allow-session'], ['拒绝', 'deny']]) {
          const button = el('button', choice === 'deny' ? '' : 'primary', label);
          button.onclick = () => choose(choice);
          actions.appendChild(button);
        }
        card.appendChild(actions);
        $('cards').appendChild(card);
      }

      function showQuestion(question) {
        if (!question) return;
        const card = el('div', 'card');
        card.appendChild(el('h4', null, question.title));
        const answers = {};
        for (const item of question.questions) {
          const row = el('div', 'row');
          row.appendChild(el('span', null, item.question));
          const input = el('input');
          input.placeholder = '回答';
          row.appendChild(input);
          card.appendChild(row);
          answers[item.id] = input;
        }
        const actions = el('div', 'actions');
        const button = el('button', 'primary', '提交回答');
        button.onclick = async () => {
          const payload = {};
          for (const [key, input] of Object.entries(answers)) payload[key] = input.value;
          card.remove();
          try {
            await api('/v1/sessions/' + currentSession + '/questions/' + question.requestId, {
              method: 'POST',
              body: JSON.stringify({ answers: payload }),
            });
            hideBanner();
          } catch (error) {
            showBanner('提交回答失败：' + error.message);
          }
        };
        actions.appendChild(button);
        card.appendChild(actions);
        $('cards').appendChild(card);
      }

      async function send() {
        const input = $('input');
        const text = input.value.trim();
        if (!text) return;
        try {
          if (!currentSession) {
            const created = await api('/v1/sessions', { method: 'POST', body: JSON.stringify({}) });
            currentSession = created.body.session.id;
            await loadSessions();
            connect(currentSession, 0);
          }
          const body = bubble('user', 'user');
          body.textContent = text;
          input.value = '';
          unsent.push(text);
          const result = await api('/v1/sessions/' + currentSession + '/messages', {
            method: 'POST',
            body: JSON.stringify({ text }),
          });
          if (result.status >= 400) throw new Error('HTTP ' + result.status);
          hideBanner();
        } catch (error) {
          const index = unsent.indexOf(text);
          if (index >= 0) unsent.splice(index, 1);
          // Drop the optimistic bubble and give the text back to the user.
          const bubbles = $('chat').querySelectorAll('.msg.user');
          for (let i = bubbles.length - 1; i >= 0; i -= 1) {
            if (bubbles[i].textContent.includes(text)) {
              bubbles[i].remove();
              break;
            }
          }
          input.value = text;
          showBanner('发送失败：' + error.message);
        }
      }

      $('send').onclick = send;
      $('input').addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(); }
      });
      $('new-session').onclick = async () => {
        try {
          const created = await api('/v1/sessions', { method: 'POST', body: JSON.stringify({}) });
          await selectSession(created.body.session.id);
        } catch (error) {
          showBanner('新建会话失败：' + error.message);
        }
      };
      function openPanel() {
        $('modal').hidden = false;
        void refreshGoal();
        void refreshPlan();
      }

      $('open-panel').onclick = () => {
        openPanel();
      };
      $('close-panel').onclick = () => {
        $('modal').hidden = true;
      };
      $('modal').onclick = (event) => {
        if (event.target === $('modal')) $('modal').hidden = true;
      };
      $('goal-set').onclick = () => void setGoal();
      $('plan-enter').onclick = () => void enterPlanMode();
      $('plan-freeze').onclick = () => void freezePlan();
      // Leaving the page releases the event stream right away instead of
      // waiting for the browser to drop the connection.
      window.addEventListener('pagehide', () => {
        if (streamAbort) streamAbort.abort();
      });

      (async () => {
        try {
          const health = await api('/health');
          $('version').textContent = health.body?.version ? 'v' + health.body.version : '';
          const list = await loadSessions();
          if (list.length > 0) await selectSession(list[0].id);
          else setConnection('已连接', true);
          // A deep link opens the panel right away: ?panel=goal or ?panel=plan
          if (new URLSearchParams(location.search).has('panel')) openPanel();
        } catch (error) {
          showBanner('无法连接运行时：' + error.message);
        }
      })();
    </script>
  </body>
</html>
